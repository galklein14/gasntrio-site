<section class="contact" id="contact">
  <div class="wrap contact-grid">
    <div>
      <h2>Let's talk</h2>
      <p class="lead">Concerts, festivals, weddings and private events, in Israel and abroad. Tell us the date, the place and what you're celebrating.</p>
      <div class="direct" id="direct"></div>
    </div>
    <form id="form" action="https://api.web3forms.com/submit" method="POST" hidden>
      <input type="hidden" name="access_key" id="form-key">
      <input type="hidden" name="subject" value="gasntrio.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <label>Name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
      <label>Event date<input name="event_date" type="date"></label>
      <label class="full">Type of event<select name="event_type"><option>Concert / festival</option><option>Wedding</option><option>Bar / bat mitzvah</option><option>Private or corporate event</option><option>Other</option></select></label>
      <label class="full">Message<textarea name="message" required></textarea></label>
      <div class="full"><button class="btn" type="submit">Send</button></div>
      <p class="form-status full" id="form-status" role="status"></p>
    </form>
  </div>
</section>
