<main id="main">

<section>
  <div class="wrap">
    <h1 class="page-title">להאזין ולצפות</h1>
    <div class="featured" id="featured"></div>
    <h2>אלבומים</h2>
    <div class="albums" id="albums"></div>
    <h2 style="margin-top:64px">סרטונים</h2>
    <div id="videos"></div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap contact-grid">
    <div>
      <h2>בואו נדבר</h2>
      <p class="lead">הופעות, פסטיבלים, חתונות ואירועים פרטיים, בארץ ובחו״ל. ספרו לנו מה התאריך, איפה ומה חוגגים.</p>
      <div class="direct" id="direct"></div>
    </div>
    <form id="form" action="https://api.web3forms.com/submit" method="POST" hidden>
      <input type="hidden" name="access_key" id="form-key">
      <input type="hidden" name="subject" value="gasntrio.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <label>שם<input name="name" required autocomplete="name"></label>
      <label>אימייל<input name="email" type="email" required autocomplete="email"></label>
      <label>טלפון<input name="phone" type="tel" autocomplete="tel"></label>
      <label>תאריך האירוע<input name="event_date" type="date"></label>
      <label class="full">סוג האירוע<select name="event_type"><option>הופעה / פסטיבל</option><option>חתונה</option><option>בר / בת מצווה</option><option>אירוע פרטי או של חברה</option><option>אחר</option></select></label>
      <label class="full">הודעה<textarea name="message" required></textarea></label>
      <div class="full"><button class="btn" type="submit">שליחה</button></div>
      <p class="form-status full" id="form-status" role="status"></p>
    </form>
  </div>
</section>
</main>
