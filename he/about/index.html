<body data-page="about">
<a class="skip" href="#main">דילוג לתוכן</a>
<header class="bar">
  <div class="wrap bar-inner">
    <a class="logo" href="/he/"><img src="/images/logo-cream.png" alt="Di Gasn Trio · די גאסן טריו" width="160" height="50"></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">תפריט</button>
    <nav id="nav" aria-label="Main">
      <a href="/he/about/" aria-current="page">עלינו</a>
      <a href="/he/concerts/">הופעות</a>
      <a href="/he/music/">מוזיקה</a>
      <a href="/he/di-gasn-events/">מופעים ואירועים</a>
      <a href="/he/lpwedding/">חתונות</a>
      <a href="/he/epk/">ערכת עיתונות</a>
      <a class="lang" href="/about/" hreflang="en" lang="en">English</a>
      <a class="btn small" href="#contact">הזמינו אותנו</a>
    </nav>
  </div>
</header>
<main id="main">

<section class="about" style="padding-top:clamp(48px,7vw,80px)">
  <div class="wrap">
    <div class="about-grid">
      <div><p class="kicker" style="color:var(--khaki)">עלינו</p><h1 class="page-title light" data-c="home.about_title"></h1><div id="about-text"></div></div>
      <div class="blob"><img src="/images/collage-hero.webp" alt="" width="452" height="502"></div>
    </div>
    <ul class="highlights" id="highlights"></ul>
    <blockquote class="quote"><span data-c="home.quote"></span><cite data-c="home.quote_by"></cite></blockquote>
  </div>
</section>
<section>
  <div class="wrap">
    <h2>ההרכב</h2>
    <div id="members" data-full="1" class="full-bios"></div>
  </div>
</section>
<section class="press-sec" id="press-sec" style="padding-top:0">
  <div class="wrap"><h2>בתקשורת וברדיו</h2><div class="media-list" id="media"></div></div>
</section>

<section class="contact" id="contact">
  <div class="wrap contact-grid">
    <div>
      <h2>בואו נדבר</h2>
      <p class="lead">הופעות, פסטיבלים, חתונות ואירועים פרטיים, בארץ ובחו״ל. ספרו לנו מה התאריך, איפה ומה חוגגים.</p>
      <div class="direct" id="direct"></div>
    </div>
    <form id="form" action="https://api.web3forms.com/submit" method="POST" hidden>
      <input type="hidden" name="access_key" id="form-key">
      <input type="hidden" name="subject" value="gasntrio.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <label>שם<input name="name" required autocomplete="name"></label>
      <label>אימייל<input name="email" type="email" required autocomplete="email"></label>
      <label>טלפון<input name="phone" type="tel" autocomplete="tel"></label>
      <label>תאריך האירוע<input name="event_date" type="date"></label>
      <label class="full">סוג האירוע<select name="event_type"><option>הופעה / פסטיבל</option><option>חתונה</option><option>בר / בת מצווה</option><option>אירוע פרטי או של חברה</option><option>אחר</option></select></label>
      <label class="full">הודעה<textarea name="message" required></textarea></label>
      <div class="full"><button class="btn" type="submit">שליחה</button></div>
      <p class="form-status full" id="form-status" role="status"></p>
    </form>
  </div>
</section>
</main>
<footer>
  <div class="wrap">
    <div class="foot">
      <div><img src="/images/logo-cream.png" alt="Di Gasn Trio" width="172" height="54"><ul id="social"></ul></div>
      <div id="foot-contact"></div>
    </div>
    <p class="fine">© <span id="year"></span> Di Gasn Trio · כל הזכויות שמורות<a href="/he/privacypolicy/">מדיניות פרטיות</a></p>
  </div>
</footer>
<script src="/app.js" defer></script>
